<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Sazzad Sir Note</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050509; --panel: rgba(255,255,255,0.035); --panel-border: rgba(167,139,250,0.18);
    --purple:#8b5cf6; --purple-bright:#a78bfa; --cyan:#22d3ee; --pink:#f472b6; --text:#e9e7f7; --text-dim:#8b87a8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; min-height:100vh; }
  .glow{ position:fixed; border-radius:50%; filter:blur(90px); z-index:0; pointer-events:none; }
  .glow.p{ width:500px; height:500px; background:radial-gradient(circle, rgba(139,92,246,0.35), transparent 70%); top:-150px; left:-100px; }
  .glow.c{ width:450px; height:450px; background:radial-gradient(circle, rgba(34,211,238,0.25), transparent 70%); bottom:-150px; right:-100px; }

  .wrap{ position:relative; z-index:1; max-width:900px; margin:0 auto; padding:28px 20px 80px; }
  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:12px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{ width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg, var(--purple), var(--cyan)); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk', sans-serif; font-weight:700; color:#05050a; font-size:16px; box-shadow:0 0 20px rgba(139,92,246,0.5); }
  .brand h1{ font-family:'Space Grotesk', sans-serif; font-size:18px; }
  .brand span{ color:var(--text-dim); font-size:11px; font-family:'JetBrains Mono', monospace; letter-spacing:1px; }

  .btn{ font-family:'Inter', sans-serif; font-weight:600; font-size:13px; cursor:pointer; border:1px solid var(--panel-border); background:var(--panel); color:var(--text); padding:9px 16px; border-radius:10px; transition:all .15s; backdrop-filter:blur(12px); }
  .btn:hover{ border-color:var(--purple-bright); box-shadow:0 0 16px rgba(139,92,246,0.25); }
  .btn.primary{ background:linear-gradient(135deg, var(--purple), #7c3aed); border:none; color:#fff; }
  .btn.primary:hover{ box-shadow:0 0 20px rgba(139,92,246,0.5); }
  .btn.danger{ border-color:rgba(244,114,182,0.4); color:var(--pink); }
  .btn.small{ padding:6px 11px; font-size:12px; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  /* login */
  .auth-wrap{ min-height:80vh; display:flex; align-items:center; justify-content:center; }
  .auth-card{ width:100%; max-width:360px; background:var(--panel); border:1px solid var(--panel-border); border-radius:18px; padding:30px 26px; backdrop-filter:blur(20px); box-shadow:0 0 60px rgba(139,92,246,0.08); }
  .auth-card h2{ font-family:'Space Grotesk', sans-serif; font-size:21px; margin-bottom:6px; }
  .auth-card p.sub{ color:var(--text-dim); font-size:13px; margin-bottom:22px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11px; font-family:'JetBrains Mono', monospace; color:var(--text-dim); margin-bottom:6px; letter-spacing:0.5px; }
  .field input, .field select, .field textarea{ width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--panel-border); border-radius:10px; padding:11px 13px; color:var(--text); font-size:14px; font-family:'Inter', sans-serif; outline:none; }
  .field input:focus, .field select:focus{ border-color:var(--purple-bright); }
  .auth-card .btn.primary{ width:100%; padding:12px; margin-top:6px; font-size:14px; }
  .error-msg{ color:var(--pink); font-size:12.5px; margin-top:10px; text-align:center; min-height:16px; }

  /* panel sections */
  .panel{ background:var(--panel); border:1px solid var(--panel-border); border-radius:16px; padding:22px; backdrop-filter:blur(16px); margin-bottom:20px; }
  .panel h3{ font-family:'Space Grotesk', sans-serif; font-size:16px; margin-bottom:16px; }
  .inline-form{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .inline-form .field{ flex:1; min-width:160px; margin-bottom:0; }

  .cat-list{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .cat-chip{ display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono', monospace; font-size:12px; padding:7px 8px 7px 12px; border-radius:100px; border:1px solid var(--panel-border); background:rgba(255,255,255,0.02); }
  .cat-chip .x{ cursor:pointer; color:var(--pink); font-size:13px; padding:2px 4px; }

  .upload-preview{ width:100%; max-height:220px; object-fit:contain; border-radius:10px; margin-top:10px; display:none; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; margin-top:6px; }
  .photo-card{ position:relative; border-radius:12px; overflow:hidden; border:1px solid var(--panel-border); }
  .photo-card img{ width:100%; height:130px; object-fit:cover; display:block; }
  .photo-card .del{ position:absolute; top:6px; right:6px; background:rgba(0,0,0,0.6); border:none; color:var(--pink); border-radius:8px; padding:4px 7px; cursor:pointer; font-size:12px; }
  .photo-card .tag{ position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.55); font-size:10px; padding:4px 8px; font-family:'JetBrains Mono', monospace; color:var(--text-dim); }

  .hidden{ display:none !important; }
</style>
</head>
<body>
<div class="glow p"></div>
<div class="glow c"></div>

<!-- LOGIN -->
<div id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <h2>Admin sign in</h2>
    <p class="sub">Sazzad Sir Note — admin panel</p>
    <div class="field"><label>USERNAME</label><input type="text" id="loginUser" autocomplete="username"></div>
    <div class="field"><label>PASSWORD</label><input type="password" id="loginPass" autocomplete="current-password"></div>
    <button class="btn primary" id="loginBtn">Sign in</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<!-- ADMIN DASHBOARD -->
<div id="dashScreen" class="wrap hidden">
  <header>
    <div class="brand">
      <div class="mark">S</div>
      <div><h1>Sazzad Sir Note</h1><span>ADMIN PANEL</span></div>
    </div>
    <div style="display:flex; gap:8px;">
      <a href="/" class="btn small">View site</a>
      <button class="btn small" onclick="logout()">Sign out</button>
    </div>
  </header>

  <!-- categories -->
  <div class="panel">
    <h3>Categories</h3>
    <div class="inline-form">
      <div class="field"><label>NEW CATEGORY NAME</label><input type="text" id="newCatName" placeholder="e.g. Class 10 Notes"></div>
      <button class="btn primary" onclick="createCategory()">Add category</button>
    </div>
    <div class="cat-list" id="catList"></div>
  </div>

  <!-- upload -->
  <div class="panel">
    <h3>Upload photo</h3>
    <div class="field">
      <label>CATEGORY</label>
      <select id="uploadCategory"></select>
    </div>
    <div class="field">
      <label>PHOTO (PNG / JPG)</label>
      <input type="file" id="uploadFile" accept="image/*" onchange="previewFile()">
      <img id="uploadPreview" class="upload-preview">
    </div>
    <div class="field">
      <label>CAPTION (OPTIONAL)</label>
      <input type="text" id="uploadCaption" placeholder="Short note about this photo">
    </div>
    <button class="btn primary" id="uploadBtn" onclick="uploadPhoto()">Upload</button>
    <div class="error-msg" id="uploadError"></div>
  </div>

  <!-- all photos -->
  <div class="panel">
    <h3>All photos</h3>
    <div class="field" style="max-width:240px;">
      <label>FILTER BY CATEGORY</label>
      <select id="filterCategory" onchange="loadPhotos()"></select>
    </div>
    <div class="grid" id="photoGrid"></div>
  </div>
</div>

<script>
const API = '/api';
let token = localStorage.getItem('sazzad_admin_token') || null;
let categories = [];

function authHeaders(json){
  const h = { 'Authorization': 'Bearer ' + token };
  if(json) h['Content-Type'] = 'application/json';
  return h;
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  err.textContent = '';
  try{
    const res = await fetch(`${API}/auth/login`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, password }) });
    const data = await res.json();
    if(!res.ok){ err.textContent = data.error || 'Login failed'; return; }
    token = data.token;
    localStorage.setItem('sazzad_admin_token', token);
    enterDashboard();
  }catch(e){ err.textContent = 'Network error — is the server running?'; }
});

function logout(){
  token = null;
  localStorage.removeItem('sazzad_admin_token');
  document.getElementById('dashScreen').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
}

async function enterDashboard(){
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('dashScreen').classList.remove('hidden');
  await loadCategories();
  await loadPhotos();
}

async function loadCategories(){
  const res = await fetch(`${API}/categories`);
  categories = await res.json();

  document.getElementById('catList').innerHTML = categories.map(c =>
    `<div class="cat-chip">${escapeHtml(c.name)} <span style="opacity:.6">(${c.count})</span><span class="x" onclick="deleteCategory('${c._id}')">✕</span></div>`
  ).join('') || '<span style="color:var(--text-dim); font-size:13px;">No categories yet</span>';

  const opts = categories.map(c => `<option value="${c._id}">${escapeHtml(c.name)}</option>`).join('');
  document.getElementById('uploadCategory').innerHTML = opts || '<option disabled>Add a category first</option>';
  document.getElementById('filterCategory').innerHTML = `<option value="">All categories</option>` + opts;
}

async function createCategory(){
  const input = document.getElementById('newCatName');
  const name = input.value.trim();
  if(!name) return;
  const res = await fetch(`${API}/categories`, { method:'POST', headers: authHeaders(true), body: JSON.stringify({ name }) });
  const data = await res.json();
  if(!res.ok){ alert(data.error || 'Could not create category'); return; }
  input.value = '';
  loadCategories();
}

async function deleteCategory(id){
  if(!confirm('Delete this category and all its photos?')) return;
  await fetch(`${API}/categories/${id}`, { method:'DELETE', headers: authHeaders() });
  loadCategories();
  loadPhotos();
}

function previewFile(){
  const file = document.getElementById('uploadFile').files[0];
  const preview = document.getElementById('uploadPreview');
  if(!file){ preview.style.display='none'; return; }
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
}

async function uploadPhoto(){
  const fileInput = document.getElementById('uploadFile');
  const category = document.getElementById('uploadCategory').value;
  const caption = document.getElementById('uploadCaption').value.trim();
  const err = document.getElementById('uploadError');
  const btn = document.getElementById('uploadBtn');
  err.textContent = '';

  if(!fileInput.files[0]){ err.textContent = 'Choose a photo first'; return; }
  if(!category){ err.textContent = 'Create a category first'; return; }

  const fd = new FormData();
  fd.append('photo', fileInput.files[0]);
  fd.append('category', category);
  fd.append('caption', caption);

  btn.disabled = true; btn.textContent = 'Uploading...';
  try{
    const res = await fetch(`${API}/images`, { method:'POST', headers: authHeaders(), body: fd });
    const data = await res.json();
    if(!res.ok){ err.textContent = data.error || 'Upload failed'; return; }
    fileInput.value = '';
    document.getElementById('uploadCaption').value = '';
    document.getElementById('uploadPreview').style.display = 'none';
    loadCategories();
    loadPhotos();
  }catch(e){
    err.textContent = 'Network error during upload';
  }finally{
    btn.disabled = false; btn.textContent = 'Upload';
  }
}

async function loadPhotos(){
  const catFilter = document.getElementById('filterCategory').value;
  const url = catFilter ? `${API}/images?category=${catFilter}` : `${API}/images`;
  const res = await fetch(url);
  const images = await res.json();
  const grid = document.getElementById('photoGrid');
  grid.innerHTML = images.map(img => {
    const cat = categories.find(c => c._id === img.category);
    return `<div class="photo-card">
      <img src="${API}/images/${img._id}/file">
      <button class="del" onclick="deletePhoto('${img._id}')">🗑️</button>
      <div class="tag">${escapeHtml(cat ? cat.name : '')}</div>
    </div>`;
  }).join('') || '<span style="color:var(--text-dim); font-size:13px;">No photos yet</span>';
}

async function deletePhoto(id){
  if(!confirm('Delete this photo?')) return;
  await fetch(`${API}/images/${id}`, { method:'DELETE', headers: authHeaders() });
  loadCategories();
  loadPhotos();
}

function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }

/* auto-login if token exists */
(async function init(){
  if(!token) return;
  // quick sanity check — try loading categories with no auth-required call, dashboard opens optimistically
  enterDashboard();
})();
</script>
</body>
</html>
