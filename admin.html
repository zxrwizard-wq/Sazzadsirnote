<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive — Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="admin-link" href="index.html">view site →</a>
<div class="wrap">
  <div class="brand">
    <div class="dot"></div>
    <h1>ARCHIVE — ADMIN</h1>
  </div>
  <div class="tagline">Add categories, topics, and content. Changes appear live on the site.</div>

  <!-- CATEGORIES -->
  <div class="panel">
    <h2>Categories <span>— top-level sections (e.g. Math, Science)</span></h2>
    <div class="row">
      <div class="field">
        <label>Icon (emoji)</label>
        <input type="text" id="catIcon" placeholder="📐" maxlength="4">
      </div>
      <div class="field" style="flex:3">
        <label>Name</label>
        <input type="text" id="catName" placeholder="Math">
      </div>
    </div>
    <button class="btn" id="addCatBtn">+ Add category</button>
    <div id="catList" style="margin-top:18px;"></div>
  </div>

  <!-- TOPICS -->
  <div class="panel">
    <h2>Topics <span>— subsections inside a category</span></h2>
    <div class="field">
      <label>Category</label>
      <select id="topicCatSelect"><option value="">Select a category…</option></select>
    </div>
    <div class="field">
      <label>Topic name</label>
      <input type="text" id="topicName" placeholder="Algebra">
    </div>
    <button class="btn" id="addTopicBtn">+ Add topic</button>
    <div id="topicList" style="margin-top:18px;"></div>
  </div>

  <!-- ITEMS -->
  <div class="panel">
    <h2>Items <span>— the actual content inside a topic</span></h2>
    <div class="row">
      <div class="field">
        <label>Category</label>
        <select id="itemCatSelect"><option value="">Select a category…</option></select>
      </div>
      <div class="field">
        <label>Topic</label>
        <select id="itemTopicSelect"><option value="">Select a topic…</option></select>
      </div>
    </div>
    <div class="field">
      <label>Type</label>
      <select id="itemType">
        <option value="text">Text / article</option>
        <option value="file">File (upload)</option>
        <option value="link">Link / video</option>
      </select>
    </div>
    <div class="field">
      <label>Title</label>
      <input type="text" id="itemTitle" placeholder="Item title">
    </div>
    <div class="field">
      <label>Short description (optional)</label>
      <input type="text" id="itemDesc" placeholder="One line summary">
    </div>

    <div class="type-fields active" id="fields-text">
      <div class="field">
        <label>Body</label>
        <textarea id="itemBody" placeholder="Full text content…"></textarea>
      </div>
    </div>
    <div class="type-fields" id="fields-file">
      <div class="field">
        <label>File</label>
        <input type="file" id="itemFile">
      </div>
    </div>
    <div class="type-fields" id="fields-link">
      <div class="field">
        <label>URL</label>
        <input type="text" id="itemUrl" placeholder="https://youtube.com/watch?v=…">
      </div>
    </div>

    <button class="btn" id="addItemBtn">+ Add item</button>
    <div id="itemList" style="margin-top:18px;"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import {
  db, storage, collection, doc, addDoc, deleteDoc, onSnapshot, query, orderBy,
  serverTimestamp, ref, uploadBytes, getDownloadURL, deleteObject
} from "./firebase-init.js";

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str ?? '';
  return d.innerHTML;
}

let categories = [];
let topics = [];
let items = [];

const topicCatSelect = document.getElementById('topicCatSelect');
const itemCatSelect = document.getElementById('itemCatSelect');
const itemTopicSelect = document.getElementById('itemTopicSelect');

// ---------- CATEGORIES ----------
onSnapshot(query(collection(db,'categories'), orderBy('createdAt','asc')), snap => {
  categories = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  renderCatList();
  renderCatSelects();
});

function renderCatSelects(){
  const opts = '<option value="">Select a category…</option>' +
    categories.map(c => `<option value="${c.id}">${c.icon||''} ${escapeHtml(c.name)}</option>`).join('');
  const prevTopicCat = topicCatSelect.value;
  const prevItemCat = itemCatSelect.value;
  topicCatSelect.innerHTML = opts;
  itemCatSelect.innerHTML = opts;
  if(categories.some(c=>c.id===prevTopicCat)) topicCatSelect.value = prevTopicCat;
  if(categories.some(c=>c.id===prevItemCat)) itemCatSelect.value = prevItemCat;
}

function renderCatList(){
  const el = document.getElementById('catList');
  if(categories.length===0){ el.innerHTML = '<div class="empty">No categories yet.</div>'; return; }
  el.innerHTML = categories.map(c => `
    <div class="list-row">
      <div class="left"><span>${c.icon||'📁'}</span><span class="name">${escapeHtml(c.name)}</span></div>
      <button class="btn danger small" data-del-cat="${c.id}">Delete</button>
    </div>
  `).join('');
  el.querySelectorAll('[data-del-cat]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.getAttribute('data-del-cat');
      if(!confirm('Delete this category? Topics and items inside it will be orphaned.')) return;
      await deleteDoc(doc(db,'categories',id));
      showToast('Category deleted');
    };
  });
}

document.getElementById('addCatBtn').onclick = async () => {
  const name = document.getElementById('catName').value.trim();
  const icon = document.getElementById('catIcon').value.trim();
  if(!name){ showToast('Enter a category name'); return; }
  await addDoc(collection(db,'categories'), { name, icon, createdAt: serverTimestamp() });
  document.getElementById('catName').value = '';
  document.getElementById('catIcon').value = '';
  showToast('Category added');
};

// ---------- TOPICS ----------
onSnapshot(query(collection(db,'topics'), orderBy('createdAt','asc')), snap => {
  topics = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  renderTopicList();
  renderTopicSelect();
});

function renderTopicSelect(){
  const catId = itemCatSelect.value;
  const filtered = topics.filter(t => t.categoryId === catId);
  itemTopicSelect.innerHTML = '<option value="">Select a topic…</option>' +
    filtered.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
}

function renderTopicList(){
  const el = document.getElementById('topicList');
  const catId = topicCatSelect.value;
  const filtered = catId ? topics.filter(t=>t.categoryId===catId) : topics;
  if(filtered.length===0){ el.innerHTML = '<div class="empty">No topics yet.</div>'; return; }
  el.innerHTML = filtered.map(t => {
    const cat = categories.find(c=>c.id===t.categoryId);
    return `
    <div class="list-row">
      <div class="left"><span class="name">${escapeHtml(t.name)}</span>
        <span style="color:var(--text-dim);font-size:12px;">${cat ? escapeHtml(cat.name) : '—'}</span>
      </div>
      <button class="btn danger small" data-del-topic="${t.id}">Delete</button>
    </div>
  `;
  }).join('');
  el.querySelectorAll('[data-del-topic]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.getAttribute('data-del-topic');
      if(!confirm('Delete this topic? Items inside it will be orphaned.')) return;
      await deleteDoc(doc(db,'topics',id));
      showToast('Topic deleted');
    };
  });
}

document.getElementById('addTopicBtn').onclick = async () => {
  const categoryId = topicCatSelect.value;
  const name = document.getElementById('topicName').value.trim();
  if(!categoryId){ showToast('Select a category first'); return; }
  if(!name){ showToast('Enter a topic name'); return; }
  await addDoc(collection(db,'topics'), { categoryId, name, createdAt: serverTimestamp() });
  document.getElementById('topicName').value = '';
  showToast('Topic added');
};

topicCatSelect.onchange = renderTopicList;
itemCatSelect.onchange = renderTopicSelect;

// ---------- ITEMS ----------
onSnapshot(query(collection(db,'items'), orderBy('createdAt','asc')), snap => {
  items = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  renderItemList();
});

document.getElementById('itemType').onchange = (e) => {
  document.querySelectorAll('.type-fields').forEach(f => f.classList.remove('active'));
  document.getElementById('fields-' + e.target.value).classList.add('active');
};

itemTopicSelect.onchange = renderItemList;

function renderItemList(){
  const el = document.getElementById('itemList');
  const topicId = itemTopicSelect.value;
  const filtered = topicId ? items.filter(i=>i.topicId===topicId) : items;
  if(filtered.length===0){ el.innerHTML = '<div class="empty">No items yet.</div>'; return; }
  el.innerHTML = filtered.map(i => `
    <div class="list-row">
      <div class="left">
        <span class="type-badge ${i.type}">${i.type}</span>
        <span class="name">${escapeHtml(i.title)}</span>
      </div>
      <button class="btn danger small" data-del-item="${i.id}" data-item-type="${i.type}" data-item-path="${i.storagePath||''}">Delete</button>
    </div>
  `).join('');
  el.querySelectorAll('[data-del-item]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.getAttribute('data-del-item');
      const type = btn.getAttribute('data-item-type');
      const path = btn.getAttribute('data-item-path');
      if(!confirm('Delete this item?')) return;
      if(type === 'file' && path){
        try{ await deleteObject(ref(storage, path)); }catch(e){ /* ignore if already gone */ }
      }
      await deleteDoc(doc(db,'items',id));
      showToast('Item deleted');
    };
  });
}

document.getElementById('addItemBtn').onclick = async () => {
  const topicId = itemTopicSelect.value;
  const type = document.getElementById('itemType').value;
  const title = document.getElementById('itemTitle').value.trim();
  const description = document.getElementById('itemDesc').value.trim();

  if(!topicId){ showToast('Select a category and topic first'); return; }
  if(!title){ showToast('Enter a title'); return; }

  const base = { topicId, type, title, description, createdAt: serverTimestamp() };
  const addBtn = document.getElementById('addItemBtn');

  try{
    if(type === 'text'){
      const body = document.getElementById('itemBody').value.trim();
      await addDoc(collection(db,'items'), { ...base, body });
    } else if(type === 'link'){
      const url = document.getElementById('itemUrl').value.trim();
      if(!url){ showToast('Enter a URL'); return; }
      await addDoc(collection(db,'items'), { ...base, url });
    } else if(type === 'file'){
      const fileInput = document.getElementById('itemFile');
      const file = fileInput.files[0];
      if(!file){ showToast('Choose a file'); return; }
      addBtn.textContent = 'Uploading…';
      addBtn.disabled = true;
      const path = `items/${Date.now()}_${file.name}`;
      const storageRef = ref(storage, path);
      await uploadBytes(storageRef, file);
      const url = await getDownloadURL(storageRef);
      await addDoc(collection(db,'items'), { ...base, url, fileName: file.name, storagePath: path });
      fileInput.value = '';
    }
    document.getElementById('itemTitle').value = '';
    document.getElementById('itemDesc').value = '';
    document.getElementById('itemBody').value = '';
    document.getElementById('itemUrl').value = '';
    showToast('Item added');
  } catch(err){
    console.error(err);
    showToast('Error: ' + err.message);
  } finally {
    addBtn.textContent = '+ Add item';
    addBtn.disabled = false;
  }
};
</script>
</body>
</html>
