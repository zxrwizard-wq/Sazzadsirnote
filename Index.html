<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sazzad Sir Note</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050509; --panel: rgba(255,255,255,0.035); --panel-border: rgba(167,139,250,0.18);
    --purple:#8b5cf6; --purple-bright:#a78bfa; --cyan:#22d3ee; --text:#e9e7f7; --text-dim:#8b87a8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; min-height:100vh; overflow-x:hidden; }
  canvas#stars{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  .glow{ position:fixed; border-radius:50%; filter:blur(90px); z-index:0; pointer-events:none; }
  .glow.p{ width:500px; height:500px; background:radial-gradient(circle, rgba(139,92,246,0.35), transparent 70%); top:-150px; left:-100px; }
  .glow.c{ width:450px; height:450px; background:radial-gradient(circle, rgba(34,211,238,0.25), transparent 70%); bottom:-150px; right:-100px; }

  .wrap{ position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:28px 20px 80px; }
  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:12px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{ width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg, var(--purple), var(--cyan)); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk', sans-serif; font-weight:700; color:#05050a; font-size:16px; box-shadow:0 0 20px rgba(139,92,246,0.5); }
  .brand h1{ font-family:'Space Grotesk', sans-serif; font-size:19px; letter-spacing:0.3px; }
  .brand span{ color:var(--text-dim); font-size:11px; font-family:'JetBrains Mono', monospace; letter-spacing:1px; }

  .cat-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px; }
  .cat-tab{
    font-family:'JetBrains Mono', monospace; font-size:12px; padding:8px 14px; border-radius:100px;
    border:1px solid var(--panel-border); background:var(--panel); color:var(--text-dim); cursor:pointer;
    backdrop-filter:blur(10px); transition:all .15s;
  }
  .cat-tab:hover{ color:var(--text); border-color:var(--purple-bright); }
  .cat-tab.active{ background:linear-gradient(135deg, var(--purple), #7c3aed); color:#fff; border-color:transparent; }
  .cat-tab .n{ opacity:0.7; margin-left:4px; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:14px; }
  .photo-card{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:14px; overflow:hidden;
    backdrop-filter:blur(10px); cursor:pointer; transition:transform .15s, box-shadow .15s;
  }
  .photo-card:hover{ transform:translateY(-3px); box-shadow:0 8px 28px rgba(0,0,0,0.5); }
  .photo-card img{ width:100%; height:180px; object-fit:cover; display:block; }
  .photo-card .cap{ padding:10px 12px; font-size:12px; color:var(--text-dim); }

  .empty-state{ text-align:center; padding:70px 20px; color:var(--text-dim); }
  .empty-state .big{ font-size:40px; margin-bottom:10px; }

  .lightbox{ position:fixed; inset:0; background:rgba(2,2,6,0.9); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:50; padding:24px; }
  .lightbox img{ max-width:100%; max-height:85vh; border-radius:12px; box-shadow:0 0 60px rgba(139,92,246,0.25); }
  .lightbox .close{ position:absolute; top:20px; right:24px; font-size:28px; color:var(--text); cursor:pointer; background:none; border:none; }
  .hidden{ display:none !important; }
  ::-webkit-scrollbar{ width:8px; } ::-webkit-scrollbar-thumb{ background:rgba(139,92,246,0.3); border-radius:10px; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="glow p"></div>
<div class="glow c"></div>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark">S</div>
      <div>
        <h1>Sazzad Sir Note</h1>
        <span>PHOTO ARCHIVE</span>
      </div>
    </div>
  </header>

  <div id="catTabs" class="cat-tabs"></div>
  <div id="grid" class="grid"></div>
  <div id="emptyState" class="empty-state hidden">
    <div class="big">📷</div>
    <div>No photos here yet.</div>
  </div>
</div>

<div id="lightbox" class="lightbox hidden">
  <button class="close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" src="">
</div>

<script>
/* starfield */
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let stars = [];
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight;
  stars = Array.from({length:90}, () => ({ x:Math.random()*canvas.width, y:Math.random()*canvas.height, r:Math.random()*1.3+0.2, a:Math.random(), da:(Math.random()*0.008)+0.002 })); }
function draw(){ ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const s of stars){ s.a+=s.da; if(s.a>1||s.a<0) s.da*=-1;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fillStyle=`rgba(200,190,255,${Math.abs(s.a)*0.8})`; ctx.fill(); }
  requestAnimationFrame(draw); }
resize(); addEventListener('resize', resize); draw();

const API = '/api';
let activeCategory = null;

async function loadCategories(){
  const res = await fetch(`${API}/categories`);
  const cats = await res.json();
  const tabsEl = document.getElementById('catTabs');
  tabsEl.innerHTML = `<div class="cat-tab ${activeCategory===null?'active':''}" onclick="selectCategory(null)">All</div>` +
    cats.map(c => `<div class="cat-tab ${activeCategory===c._id?'active':''}" onclick="selectCategory('${c._id}')">${escapeHtml(c.name)}<span class="n">${c.count}</span></div>`).join('');
}

async function loadImages(){
  const url = activeCategory ? `${API}/images?category=${activeCategory}` : `${API}/images`;
  const res = await fetch(url);
  const images = await res.json();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  grid.innerHTML = '';
  if(images.length === 0){ empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  for(const img of images){
    const card = document.createElement('div');
    card.className = 'photo-card';
    card.onclick = () => openLightbox(img._id);
    card.innerHTML = `<img src="${API}/images/${img._id}/file" loading="lazy" alt="${escapeHtml(img.caption||img.filename)}">
      ${img.caption ? `<div class="cap">${escapeHtml(img.caption)}</div>` : ''}`;
    grid.appendChild(card);
  }
}

function selectCategory(id){ activeCategory = id; loadCategories(); loadImages(); }
function openLightbox(id){ document.getElementById('lightboxImg').src = `${API}/images/${id}/file`; document.getElementById('lightbox').classList.remove('hidden'); }
function closeLightbox(){ document.getElementById('lightbox').classList.add('hidden'); }
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }

loadCategories();
loadImages();
</script>
</body>
</html>
